<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d3d77">
  <meta name="description" content="ルナネコカフェパズル。同じスイーツをつなげて消す、60秒のカフェパズルゲーム。">
  <title>LUNA NECO CAFE PUZZLE</title>
  <link rel="icon" href="./assets/images/paw.png" type="image/png">
  <link rel="stylesheet" href="./src/styles.css?v=1.1.0">
</head>
<body>
  <div id="audio-assets" hidden></div>
  <div id="round-status" role="status" aria-live="polite"></div>
  <button id="sound-btn" type="button" aria-label="音をミュート" aria-pressed="false">♪ ON</button>
  <div id="game-container">
    <div id="ui-layer">
      <div id="score-text"></div>
      <div id="time-text"></div>
      <div id="time-plus-text" style="display: none; color: #ffff00; font-size: 24px; font-weight: bold; margin-left: 5px; text-shadow: 2px 2px 0 #5c4033, -2px -2px 0 #5c4033, 2px -2px 0 #5c4033, -2px 2px 0 #5c4033; vertical-align: middle;">+10</div>
      <div id="multiplier-text" style="display: none; color: #ff00ff; font-size: 20px; font-weight: bold; margin-top: 10px; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;">SCORE x2 !!</div>
    </div>
  </div>

  <div id="loading-overlay" class="overlay">
    <div id="loading-text"></div>
  </div>

  <div id="start-overlay" class="overlay" style="background: #000;">
    <div class="title-art">
      <img id="start-img" alt="LUNA NECO CAFE PUZZLE — ルナネコカフェパズル" width="1050" height="1690">
      <div style="position: absolute; bottom: 10%; width: 100%; text-align: center;">
        <button id="start-btn" class="btn" style="padding: 10px 30px; font-size: 22px; box-shadow: 0 4px 0 #6b8e23; display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto;">
          <img id="start-btn-icon" style="width: 24px; height: 24px; image-rendering: pixelated;" alt="">
          <span id="start-btn-text"></span>
        </button>
      </div>
      <button id="ranking-open-btn" class="small-btn title-ranking" type="button"></button>
    </div>
  </div>

  <div id="ranking-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ranking-heading" style="display: none;">
    <div class="panel">
      <h2 id="ranking-heading"></h2>
      <div id="national-ranking" class="ranking-container" aria-live="polite"></div>
      <button id="ranking-refresh-btn" class="small-btn" type="button"></button>
      <button id="ranking-close-btn" class="small-btn" type="button"></button>
    </div>
  </div>

  <div id="result-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-msg">
    <div class="panel">
      <h2 id="result-msg"></h2>
      <div id="result-score"></div>

      <div id="name-entry-container" style="display: none; margin-bottom: 20px;">
        <p id="name-entry-msg" style="color: #5c4033; margin-bottom: 10px; font-size: 20px; font-weight: bold;"></p>
        <input type="text" id="player-name-input" maxlength="10" style="padding: 10px; font-size: 18px; border: 3px solid #5c4033; border-radius: 8px; width: 80%; font-family: 'DotGothic16', sans-serif; text-align: center; margin-bottom: 10px;">
        <p id="name-public-note" class="ranking-note"></p>
        <button id="submit-score-btn" class="btn" style="padding: 10px 30px; font-size: 20px;"></button>
      </div>

      <p id="submission-status" class="ranking-note" role="status" aria-live="polite"></p>
      <div id="result-ranking" class="ranking-container" aria-live="polite"></div>
      <button id="retry-btn" class="btn"></button>
    </div>
  </div>
